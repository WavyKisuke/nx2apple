name: iOS 27.2 A14 build

on:
  workflow_dispatch:
  push:
    branches: [odyssey-a14]
  pull_request:
    branches: [odyssey-a14]

permissions:
  contents: read

env:
  GAME: "0100000000010000"

defaults:
  run:
    shell: bash

jobs:
  ios-build:
    name: Xcode 27.2 / iOS 27.2 / A14
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2 and verify SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK: $SDK"
          test "$SDK" = "27.2"
      - name: Verify Odyssey A14 build configuration
        run: |
          grep -n -- '-mcpu=apple-a14' dm/ios/project.yml
          test "$(python3 dm/games/game.py "$GAME" tex_bc_cpu)" = on
          python3 dm/games/game.py header "$GAME" "$RUNNER_TEMP/game_profile.h"
          grep -q -- "#define DM_GAME_TEX_BC_CPU 1" "$RUNNER_TEMP/game_profile.h"
      - name: Validate the production NSP-to-IPA build script
        run: |
          python3 -m py_compile scripts/build_ipa_from_nsp.py
          python3 scripts/build_ipa_from_nsp.py --help >/dev/null
      - name: Verify generated shader-chain header
        run: |
          python3 dm/gfx/tools/dmsh_chain.py --header
          git diff --exit-code -- dm/gfx/nvn/dmsh_chain.h
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Test texture subsystem (BC decode, Metal format mapping, deswizzle)
        run: make -C dm/gfx/tex/tests run
      - name: Compile geometry replay test and run CPU-only coverage
        run: |
          make -C dm/gfx/tests GAME=$GAME t_geometry
          dm/gfx/tests/t_geometry --cpu-only
          echo "::notice::Metal 4 geometry GPU replay is compile-checked here; execution requires a Metal 4-capable device, not the GitHub paravirtual GPU."
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test geometry translator lowering and diagnostics
        env:
          DMSH_TEST_XLATE: ${{ github.workspace }}/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate
        run: python3 -m unittest discover -s dm/gfx/tests -p 'test_dmsh_geometry.py' -v
      - name: Test iOS RomFS picker validation and startup lookup
        run: python3 -m unittest discover -s dm/ios/tests -p 'test_romfs_startup.py' -v
      - name: Build and archive CI-only non-runnable iOS fixture
        run: |
          mkdir -p logs
          python3 dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke" 2>&1 | tee logs/ios-build.log
          app="$RUNNER_TEMP/ios-smoke/derived/Build/Products/Release-iphoneos/DmIOS.app"
          package="$RUNNER_TEMP/ios-smoke/package"
          archive="$RUNNER_TEMP/ios-smoke/NX2Apple-CI-ONLY-NOT-RUNNABLE.zip"
          test -d "$app"
          mkdir -p "$package"
          ditto "$app" "$package/DmIOS.app"
          printf '%s\n' 'CI COMPILE/LINK FIXTURE ONLY — NOT AN INSTALLABLE OR PLAYABLE APP.' 'This bundle embeds zero-filled placeholder game modules and synthetic resources.' 'It contains no game files, keys, real shader libraries, or device-tested runtime.' 'Do not install or launch it.' > "$package/DmIOS.app/CI_FIXTURE_NOT_RUNNABLE.txt"
          (cd "$package" && /usr/bin/zip -qry "$archive" DmIOS.app)
          test -s "$archive"
          /usr/bin/unzip -Z1 "$archive" | grep -qx 'DmIOS.app/Info.plist'
          /usr/bin/unzip -Z1 "$archive" | grep -qx 'DmIOS.app/CI_FIXTURE_NOT_RUNNABLE.txt'
      - name: Upload CI-only non-runnable build fixture (not an IPA)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx2apple-odyssey-ios27.2-a14-CI-only-NOT-runnable-fixture
          path: ${{ runner.temp }}/ios-smoke/NX2Apple-CI-ONLY-NOT-RUNNABLE.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx2apple-ios27.2-build-logs
          path: logs
          retention-days: 7
