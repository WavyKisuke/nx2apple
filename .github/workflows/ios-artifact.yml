name: iOS artifact build

on:
  workflow_dispatch:
  push:
    branches: [a14-test]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ios-artifact:
    name: iOS 27.2 A14 unsigned build artifact
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      GAME: 010015100B514000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2 / verify iOS 27.2 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.2"
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build production iOS project with synthetic inputs
        run: |
          mkdir -p logs
          python3 dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke" 2>&1 | tee logs/ios-build.log
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx2apple-ios27.2-a14-unsigned-fixture
          path: ${{ runner.temp }}/ios-smoke/DmIOS-CI-synthetic.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-ios-build
          path: logs
          retention-days: 7
