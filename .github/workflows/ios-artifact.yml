name: iOS artifact build

on:
  workflow_dispatch:
  push:
    branches: [a14-test]

permissions:
  contents: read

jobs:
  ios-artifact:
    name: Unsigned iOS build artifact (synthetic)
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GAME: 010015100B514000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build synthetic iOS app and IPA
        run: |
          mkdir -p logs
          python3 dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke" 2>&1 | tee logs/ios-build.log
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nx2apple-ios-synthetic-unsigned-ipa
          path: ${{ runner.temp }}/ios-smoke/DmIOS-CI-synthetic.ipa
          if-no-files-found: error
          retention-days: 14
