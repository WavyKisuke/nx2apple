name: Repair truncated sync helper

on:
  push:
    branches: [a14-test]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair sync helper from parent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restore sync helper
        run: |
          git checkout 30559cf48cffa6c1c7ad82de4a01ea4109fc93f4 -- scripts/sync_upstream.py
          python3 -m py_compile scripts/sync_upstream.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/sync_upstream.py
          git commit -m 'Repair sync helper from parent'
          git push origin HEAD:a14-test
      - name: Remove repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-sync-script.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Remove temporary sync repair workflow'
          git push origin HEAD:a14-test
