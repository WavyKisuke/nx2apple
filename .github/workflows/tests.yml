# Taken from seedds/nxnative's tests.yml (.github is not part of the sync, so it is carried here by hand), plus the fork's own front ends: the Mac launcher
# (frontend/, Swift test) and the Windows Qt front end's pure-Python tests (frontend-qt/tests). docs/agents/06-dev-loop.md describes the upstream jobs.
# Tests that need no game files, keys or GPU. GitHub's macOS runners are virtual Macs without Metal 4 (issue #112), so the tests that go through mtl_init
# (t_nvn, t_mip_extent, t_rt_range and the rest of dm/gfx/tests' run list) stay local: run `make -C dm/gfx/tests GAME=<id> run` on an Apple-silicon Mac.
# `profile_guess.py --check` stays local too: it compares the guesses with the extractions of the games (it needs their files).
name: tests

on:
  pull_request:
  push:
    branches: [main, a14-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAME: 010015100B514000   # Super Mario Bros. Wonder: the profile the host and gfx tests are built for (any profile does; the tests are about code, not the game)

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment): a tag can be moved, a SHA cannot. Dependabot (github-actions) can raise them.
jobs:
  host-tests:
    name: Host unit tests and CPU-only gfx tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host unit tests (dm/host/tests)
        run: |
          mkdir -p logs
          make -C dm/host/tests run 2>&1 | tee logs/host-tests.txt
      - name: CPU-only gfx tests
        run: |
          make -C dm/gfx/tests cpu 2>&1 | tee logs/gfx-cpu-tests.txt
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-tests
          path: logs

  tool-tests:
    name: Python tool tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python tests
        run: python3 -m unittest discover -s dm -p 'test_*.py'

  sync-patchers:
    name: Upstream sync patchers
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check patchers
        run: python3 tools/sync.py --check

  build:
    name: Build checks
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile check
        run: python3 dm/ios/tools/compile_check.py

  launcher:
    name: Mac launcher tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Swift tests
        run: swift test --package-path frontend

  qt-launcher:
    name: Qt launcher tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python tests
        run: python3 -m unittest discover -s frontend-qt/tests -p 'test_*.py'

  ios-build:
    name: iOS synthetic build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build synthetic iOS app
        run: python3 dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke"
      - name: Upload iOS smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: ${{ runner.temp }}/ios-smoke
