# Taken from seedds/nxnative's tests.yml (.github is not part of the sync, so it is carried here by hand), plus the fork's own front ends: the Mac launcher
# (frontend/, swift test) and the Windows Qt front end's pure-Python tests (frontend-qt/tests). docs/agents/06-dev-loop.md describes the upstream jobs.
# Tests that need no game files, keys or GPU. GitHub's macOS runners are virtual Macs without Metal 4 (issue #112), so the tests that go through mtl_init
# (t_nvn, t_mip_extent, t_rt_range and the rest of dm/gfx/tests' run list) stay local: run `make -C dm/gfx/tests GAME=<id> run` on an Apple-silicon Mac.
# `profile_guess.py --check` stays local too: it compares the guesses with the extractions of the games (it needs their files).
name: tests

on:
  pull_request:
  push:
    branches: [main, a14-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  # Do not cancel an in-progress validation run when another commit lands. A cancelled
  # required check can make a protected branch look incomplete even when the code is fine.
  cancel-in-progress: false

env:
  GAME: 010015100B514000

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: Host unit tests and CPU-only gfx tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Host unit tests
        run: |
          mkdir -p logs
          make -C dm/host/tests GAME="$GAME" -j3 run 2>&1 | tee logs/host-tests.log
      - name: CPU texture tests
        run: |
          make -C dm/gfx/tex/tests t_tex 2>&1 | tee logs/texture-build.log
          dm/gfx/tex/tests/t_tex 2>&1 | tee logs/texture-tests.log
      - name: CPU-only gfx tests
        run: |
          cd dm/gfx/tests
          make GAME="$GAME" -j3 t_perf_order
          ./t_perf_order --cpu
          tests="t_dirty_slots t_dirty_race t_tex_layout t_pace t_fstep t_link_ticks t_cpu_tex t_hmap t_cover t_pso_skey t_refl t_rt_range_ro t_present_rescue t_gpuprof"
          make GAME="$GAME" -j3 $tests
          failed=0
          for t in $tests; do ./$t || failed=1; done
          exit $failed
      - name: OpenGL imports
        run: make -C dm/gfx/tests GAME="$GAME" gl-imports

  tool-tests:
    name: Tool tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - name: Install Python packages
        run: python -m pip install lz4 capstone fonttools
      - name: Run Python tests
        env:
          DM_GAME: ${{ env.GAME }}
          DMSH_TEST_XLATE: ${{ github.workspace }}/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate
        run: |
          failed=0
          for f in dm/tools/tests/test_*.py dm/ios/tests/test_*.py dm/gfx/tests/test_*.py; do
            python -m unittest -v "$f" || failed=1
          done
          exit $failed

  sync-patchers:
    name: Sync patchers against seedds main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Fetch seedds main and sync base
        run: |
          git remote add seedds https://github.com/seedds/nxnative.git
          git fetch --no-tags --depth=1 seedds main
          git fetch --no-tags --depth=1 seedds "$(cat .upstream-ref)"
      - name: Patcher tests
        run: python -m unittest -v scripts/tests/test_sync_patchers.py

  build:
    name: Build check (Mac host, gfx tests, iOS sources)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Mac host profiles
        run: |
          for g in 010015100B514000 0100535012974000 010014E00DB56000; do
            make -C dm/host GAME=$g -j3 dmhost
            test -x dm/host/dmhost
          done
      - name: Compile all gfx tests
        run: |
          cd dm/gfx/tests
          tests=$(sed -n 's/^\(t_[a-z0-9_]*\):.*/\1/p' Makefile | sort -u)
          make GAME="$GAME" -j3 $tests
      - name: iOS source compile check
        run: python3 dm/ios/tools/compile_check.py

  launcher:
    name: Mac launcher
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Release build and tests
        working-directory: frontend
        run: |
          swift build -c release
          swift test

  launcher-qt:
    name: Qt front end tests
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Tests
        run: python -m unittest discover -s frontend-qt/tests -v

  ios-build:
    name: iOS 27.2 A14 production-project build check
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2 / verify iOS 27.2 SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.2"
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build production iOS project with synthetic inputs
        run: |
          mkdir -p logs
          python3 dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke" 2>&1 | tee logs/ios-build.log
      - name: Upload successful unsigned IPA fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nx2apple-ios27.2-a14-unsigned-fixture
          path: ${{ runner.temp }}/ios-smoke/DmIOS-CI-synthetic.ipa
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: logs-ios-build
          path: logs
          retention-days: 7

# Push-trigger verification marker: a14-test workflow path.
